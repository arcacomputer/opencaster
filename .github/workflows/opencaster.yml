name: Opencaster
# Always report the check, including docs-only PRs. The dev log guard decides
# whether a changed path ships; top-level path filters can omit large diffs.
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    env:
      VITE_WALLETCONNECT_PROJECT_ID: ${{ vars.VITE_WALLETCONNECT_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --frozen-lockfile
      - name: Require release notes for shipped changes
        env:
          # PRs and incremental feature pushes compare the entire branch. The
          # default-branch push compares the actual pre-push release, not the
          # already updated origin/main. Never execute event values as code.
          DEVLOG_BASE: ${{ github.event.pull_request.base.sha || (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event.before) || format('origin/{0}', github.event.repository.default_branch) }}
          DEVLOG_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          DEVLOG_MERGE_BASE: ${{ github.event_name == 'pull_request' || github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          args=(--base "$DEVLOG_BASE" --head "$DEVLOG_HEAD")
          if [ "$DEVLOG_MERGE_BASE" = "true" ]; then args+=(--merge-base); fi
          yarn check:devlog "${args[@]}"
      - run: yarn verify
      - name: Check offline signer payload reproducibility
        run: |
          cp apps/signer/dist-signer/BUILD-MANIFEST.json /tmp/arca-signer-manifest.json
          yarn signer:build
          diff -u /tmp/arca-signer-manifest.json apps/signer/dist-signer/BUILD-MANIFEST.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arca-signer-reviewed-payload
          path: apps/signer/dist-signer/
          retention-days: 30
