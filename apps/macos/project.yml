name: Opencaster
options:
  bundleIdPrefix: com.arcacomputer
  deploymentTarget:
    macOS: "15.0"
  generateEmptyDirectories: true
packages:
  HypersnapKit:
    path: HypersnapKit
targets:
  Opencaster:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Opencaster
    dependencies:
      - package: HypersnapKit
        product: HypersnapKit
      - package: HypersnapKit
        product: HypersnapProtocol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arcacomputer.opencaster
        PRODUCT_NAME: Opencaster
        DEVELOPMENT_TEAM: 48H3WZWYU3
        CODE_SIGN_ENTITLEMENTS: Opencaster/Opencaster.entitlements
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Opencaster
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        INFOPLIST_KEY_LSMinimumSystemVersion: "15.0"
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
    scheme:
      testTargets:
        - OpencasterUITests
  OpencasterUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: OpencasterUITests
    dependencies:
      - target: Opencaster
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arcacomputer.opencaster.uitests
        TEST_TARGET_NAME: Opencaster
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: 48H3WZWYU3
        SWIFT_VERSION: "6.0"
